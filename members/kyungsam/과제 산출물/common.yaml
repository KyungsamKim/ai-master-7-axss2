# =============================================================================
# Semantic Layer — 공통 계층 (전 화면 공통 어휘)
# =============================================================================
# 2주차 산출물 5장 기준.
#   - 작성 방식: 수기 · 거의 불변
#   - 담는 것  : 업무 객체(entity), 공통 measure/dimension 어휘,
#               단위 관례, semantic_role 규약, 템플릿용 업무 용어
#
# [TBD] 아래 내용은 "구조를 보여 주기 위한 최소 뼈대"다.
#       실제 SCM 업무 객체 / 지표 정의 / 제품속성은 다음 주에 회사 자료로 채운다.
#       채울 때는 키 이름만 유지하면 로더 코드는 손대지 않아도 된다.
# =============================================================================

version: 0.1
updated_at: "2026-08-12"

# -----------------------------------------------------------------------------
# semantic_role 규약
# -----------------------------------------------------------------------------
# 화면별 계층의 각 컬럼은 아래 role 중 하나를 갖는다.
# classify_screen_type(부록 A.3)이 이 role을 보고 화면 유형을 판정한다.
semantic_roles:
  time:
    description: 시간축. 추세·기간 증감 분석의 기준이 되는 컬럼
    chart_axis: x
  dimension:
    description: 범주축. 비교·기여도 분석의 그룹 기준이 되는 컬럼
    chart_axis: x
  measure:
    description: 측정값. 합계·평균 등 집계 대상이 되는 수치 컬럼
    chart_axis: y
  identifier:
    description: 식별자. 집계 대상이 아니며 상세 표에서만 의미가 있는 컬럼
    chart_axis: none
  attribute:
    description: 부가 속성. 화면 표시에는 쓰이나 분석 축으로는 쓰지 않는 컬럼
    chart_axis: none

# -----------------------------------------------------------------------------
# 단위 관례
# -----------------------------------------------------------------------------
units:
  KRW:
    label: 원
    format: "#,##0"
    scale: 1
  KRW_K:
    label: 천원
    format: "#,##0"
    scale: 1000
  EA:
    label: EA
    format: "#,##0"
    scale: 1
  PCT:
    label: "%"
    format: "0.0"
    scale: 1
  DAY:
    label: 일
    format: "#,##0"
    scale: 1
  # semantic_layer.d2 의 AggGrid.Format.currency_fmt 대응 (달러 표기 3종)
  USD:
    label: 달러
    format: "#,##0"
    scale: 1
  USD_M:
    label: 백만달러
    format: "#,##0"
    scale: 1000000
  USD_B:
    label: 10억달러
    format: "#,##0"
    scale: 1000000000

# -----------------------------------------------------------------------------
# 업무 객체 (entity)
# -----------------------------------------------------------------------------
# 화면별 계층의 컬럼이 entity: Item 처럼 이름으로 이 정의를 참조한다.
# 온톨로지 확장(2주차 산출물 5.2)은 여기 related 필드를 씨앗으로 삼는다.
entities:
  Item:
    label: 품목
    key_columns: [ITEM_CD]
    # [TBD] 제품속성(제품군/등급/규격 등)은 다음 주에 회사 기준으로 채운다.
    attributes: []
    related: [Plant, Supplier]
  Plant:
    label: 공장
    key_columns: [PLANT_CD]
    attributes: []
    related: [Item]
  Supplier:
    label: 공급업체
    key_columns: [VENDOR_CD]
    attributes: []
    related: [Item, Order]
  # 메모리 반도체 제품. semantic_layer.d2 의 AggGrid.Dimension 제품 속성축이
  # 전부 이 객체의 속성이다. [TBD] d2 완성 후 attributes 를 채운다.
  Product:
    label: 제품
    key_columns: [SCM_FAMILY_CD, TECH_CD, CHG_PROD_MODE_CD, SCM_PROD_VER_CD]
    attributes: []
    related: [Item]
  Order:
    label: 발주
    key_columns: [PO_NO]
    attributes: []
    related: [Item, Supplier, Plant]

# -----------------------------------------------------------------------------
# 공통 measure 어휘 (지표 정의)
# -----------------------------------------------------------------------------
# [TBD] 실제 지표 정의(계산식·집계 방식·단위)는 다음 주에 회사 자료로 채운다.
#       여기 정의된 이름을 화면별 계층에서 measure_ref 로 참조하게 할 예정.
measures: {}
#  예시 형태 (다음 주에 이 모양으로 채운다):
#  order_qty:
#    label: 발주수량
#    unit: EA
#    aggregation: sum
#    definition: "TBD — 회사 지표 정의서 기준"

# -----------------------------------------------------------------------------
# 공통 dimension 어휘
# -----------------------------------------------------------------------------
# [TBD] 실제 공통 분석축 목록은 다음 주에 채운다.
dimensions: {}

# -----------------------------------------------------------------------------
# 템플릿용 업무 용어
# -----------------------------------------------------------------------------
# present 노드가 문장을 만들 때 쓰는 표현 조각들이다.
# LLM이 문장을 쓰지 않으므로(Constitution), 표현은 전부 여기와 templates.py에 있다.
terms:
  increase: 증가
  decrease: 감소
  flat: 보합
  total: 합계
  period: 기간
  top_contributor: 최대 기여
  compared_to_previous: 직전 대비
